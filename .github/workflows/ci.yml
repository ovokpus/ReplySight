name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Offline tests only: the older tests/ and evals/ suites call OpenAI/Tavily live.
      - run: python -m pytest -q -p no:warnings tests/test_offline.py
  compose-build:
    needs: [api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
